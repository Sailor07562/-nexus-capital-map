name: Stock review gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-review-gate:
    name: stock-review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise failure and tamper cases
        run: python3 -m unittest discover -s tests -p 'test_stock_review_gate.py' -v
      - name: Validate repository stock-review packets
        run: python3 scripts/stock_review_gate.py check-repository
